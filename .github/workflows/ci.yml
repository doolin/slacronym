# CI: test, lint, format check, audit. Uploads compliance artifacts (with commit hash) for each run.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  id-token: write # needed for OIDC / configure-aws-credentials
  contents: read # needed for actions/checkout

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test:ci

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.tap
            test-results.json
          retention-days: 90
        # Artifacts include commit hash (GITHUB_SHA) in file headers for compliance

      - name: Lint
        run: yarn lint:ci

      - name: Upload lint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.txt
          retention-days: 90
        # lint-results.txt includes commit hash in header

      - name: Check formatting
        run: yarn format:check

      - name: Audit dependencies
        run: yarn audit:ci

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.txt
          retention-days: 90
        # audit-results.txt includes commit hash in header

      - name: Configure AWS credentials (OIDC)
        if: always() && vars.S3_COMPLIANCE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Write Solana keypair to temp file
        if: always() && vars.S3_COMPLIANCE_BUCKET != ''
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
        run: |
          if [ -n "$SOLANA_KEYPAIR" ]; then
            KEYPAIR_FILE=$(mktemp)
            printf '%s' "$SOLANA_KEYPAIR" > "$KEYPAIR_FILE"
            chmod 600 "$KEYPAIR_FILE"
            echo "SOLANA_KEYPAIR_PATH=$KEYPAIR_FILE" >> "$GITHUB_ENV"
          fi

      - name: Attest CI artifacts on Solana
        if: always() && vars.S3_COMPLIANCE_BUCKET != ''
        env:
          S3_BUCKET: ${{ vars.S3_COMPLIANCE_BUCKET }}
          SOLANA_NETWORK: devnet
        run: yarn attest

      - name: Upload attestation artifacts
        if: always() && vars.S3_COMPLIANCE_BUCKET != ''
        uses: actions/upload-artifact@v4
        with:
          name: attestation
          path: |
            ci-artifacts.zip
            attestation.pdf
          retention-days: 90

      - name: Cleanup keypair
        if: always()
        run: rm -f "$SOLANA_KEYPAIR_PATH"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Deploy to Lambda
        run: ./deploy.sh
