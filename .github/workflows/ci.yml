# CI: test, lint, format check, audit. Uploads compliance artifacts (with commit hash) for each run.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  id-token: write # needed for OIDC / configure-aws-credentials
  contents: read # needed for actions/checkout

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test:ci

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.tap
            test-results.json
          retention-days: 90
        # Artifacts include commit hash (GITHUB_SHA) in file headers for compliance

      - name: Lint
        run: yarn lint:ci

      - name: Upload lint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.txt
          retention-days: 90
        # lint-results.txt includes commit hash in header

      - name: Check formatting
        run: yarn format:check

      - name: Audit dependencies
        run: yarn audit:ci

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.txt
          retention-days: 90
        # audit-results.txt includes commit hash in header

      - name: Configure AWS credentials (OIDC)
        if: always() && vars.S3_COMPLIANCE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-1' }}

      - name: Upload CI artifacts to S3
        if: always() && vars.S3_COMPLIANCE_BUCKET != ''
        env:
          S3_BUCKET: ${{ vars.S3_COMPLIANCE_BUCKET }}
        run: |
          PREFIX="slacronym/ci/${{ github.sha }}"
          aws s3 cp test-results.tap "s3://${S3_BUCKET}/${PREFIX}/test-results.tap"
          aws s3 cp test-results.json "s3://${S3_BUCKET}/${PREFIX}/test-results.json"
          aws s3 cp lint-results.txt "s3://${S3_BUCKET}/${PREFIX}/lint-results.txt"
          aws s3 cp audit-results.txt "s3://${S3_BUCKET}/${PREFIX}/audit-results.txt"
          echo "Artifacts uploaded to s3://${S3_BUCKET}/${PREFIX}/"
