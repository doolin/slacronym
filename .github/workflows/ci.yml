# CI: test, lint, format check, audit. Uploads compliance artifacts (with commit hash) for each run.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test:ci

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.tap
            test-results.json
          retention-days: 90
        # Artifacts include commit hash (GITHUB_SHA) in file headers for compliance

      - name: Lint
        run: yarn lint:ci

      - name: Upload lint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.txt
          retention-days: 90
        # lint-results.txt includes commit hash in header

      - name: Check formatting
        run: yarn format:check

      - name: Audit dependencies
        run: yarn audit:ci

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.txt
          retention-days: 90
        # audit-results.txt includes commit hash in header
